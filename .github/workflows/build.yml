
name: Build CreativeSquad4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP do projeto nao encontrado"
            exit 1
          fi
          mkdir -p source
          unzip -o "$ZIP" -d source
          BUILD=$(find source -name build.gradle.kts -print -quit)
          if [ -z "$BUILD" ]; then
            echo "build.gradle.kts nao encontrado"
            find source -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD")
          echo "Projeto encontrado em: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build

      - uses: actions/upload-artifact@v4
        with:
          name: CreativeSquad4Paper-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
