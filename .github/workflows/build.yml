name: Build CreativeSquad4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: |
          unzip -o CreativeSquad4Paper-mobile-build.zip -d source

      - name: Build plugin
        run: gradle -p source/CreativeSquad4Paper build

      - uses: actions/upload-artifact@v4
        with:
          name: CreativeSquad4Paper-JAR
          path: source/CreativeSquad4Paper/build/libs/*.jar
